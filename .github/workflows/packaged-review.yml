name: Validate packaged Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Early access release tag containing the signed testing APK
        required: true
        default: v1.0.0
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the actual signed testing APK
        run: gh release download "$RELEASE_TAG" --pattern AmerikaSocial-1.0.0-testing.apk --dir package
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install package/AmerikaSocial-1.0.0-testing.apk
            adb logcat -c
            adb shell am start -W -n social.amerika.android/.MainActivity
            sleep 25
            adb shell uiautomator dump /sdcard/amerika-ui.xml
            adb pull /sdcard/amerika-ui.xml android-ui.xml
            adb exec-out screencap -p > android-preview.png
            adb logcat -d -v brief -s AndroidRuntime:E ReactNativeJS:E | sed '/^--------- beginning of/d' > android-runtime.log
            test ! -s android-runtime.log
            grep -E 'Home|Friends|Sign in' android-ui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Packaged-Android-preview
          path: |
            android-preview.png
            android-ui.xml
            android-runtime.log
